human:
  # 人の関節の可動範囲・最大角速度・最大角加速度（文献から集めた値）
  # 用途
  #   Microban の全身トラッキングで、写す前の人の骨格の関節角に当てる制限。
  #   1) モーションキャプチャの誤り（ありえない角度・速さ）を除く。
  #   2) PICO の体の追跡の跳びを除く。
  #   ロボットの関節ではなく、人の解剖学の軸（屈曲・伸展、外転・内転、内旋・外旋など）で書いた。
  #
  # 角度の決め方
  #   - 解剖学的基本肢位（直立、Neutral Zero）を 0 度とする。
  #   - 各軸の正の向きは positive に書いた。rom.adopted の lower / upper はその向きでの符号付きの値（度）。
  #   - 左右は同じ値とする。
  #
  # 単位: 角度 deg、角速度 deg/s、角加速度 deg/s^2
  #
  # 各記録の項目
  #   src        : 出典の鍵（ファイル末尾の sources）
  #   value      : 論文の数字（そのまま写した）。mean / sd は平均と標準偏差。range は範囲。
  #   mode       : active（自動）/ passive（他動）/ dynamic（運動中に実際に出た角度）
  #   verified   : full_text（本文・表を開いて確認）/ abstract（要旨で確認）
  #                / secondary（別の文献で確認。原典は開けず）/ no（確認できず）
  #   upper_2sd  : 平均 + 2SD を自分で計算した値（論文の数字ではない）。
  #   p97_5      : CDC が公開している Soucie 2011 の元データから計算した 97.5 パーセンタイル（論文の数字ではない）。
  #   computed   : true なら、その記録の value は自分で計算した値（式は note）。
  #
  # 採用（adopted）の方針
  #   - 用途が「ありえない値を除く」なので、健常者で大きい側の値を採った。小さい値を採ると、本物の動きを誤りとして捨てるため。
  #   - 可動範囲: 次の候補のうち最大を採った。
  #       a) 標準値: 日本整形外科学会・日本リハビリテーション医学会 2022、AAOS 1965、渡辺 1979（日本人の平均）
  #       b) 健常な若い成人の上側のばらつき: 平均 + 2SD（計算）、97.5 または 95 パーセンタイル
  #          使った研究: Soucie/CDC、Boone & Azen、Roaas & Andersson、Svenningsen、McKay、Han、Menadue、
  #          Medina McKeon、Vairo、zarate2023、ferrario2002、mousavi2018
  #     測り方で値が 2 倍近く変わる軸がある（others_note に書いた）。外れた値の目立つ研究（修士論文、SD の不自然な研究）は採用の計算に入れなかった。
  #   - 角速度: 健常者の速い動き（競技を含む）で報告された群の値のうち、原典で確かめた最大。
  #     二次引用だけの値と、1 人だけの値は候補に並べるにとどめた。けが（捻挫）の瞬間の値は採らず、参考として別に書いた。
  #   - 角加速度: 速い動きで測った値があればそれを採り、なければ推定した（estimated: true）。
  #   - 余裕（マージン）は足していない。足すかどうかは使う側で決める。
  #   - 角速度・角加速度の多くは群の平均なので、個人の最大はそれより大きい。分かる場合は upper_2sd や個人の最大を併記した。
  #
  # 角加速度の推定のしかた（速い動きで測った値がない軸）
  #   角加速度と角速度の両方の採用値がある 8 軸で、比 alpha / omega を計算すると 5.4〜13.8 /s だった
  #   （股屈曲伸展 13.8、肩内旋 13.1、体幹回旋 12.1、首回旋 10.9、肘伸展 10.3、足首背屈底屈 7.4、膝 6.7、肩屈曲 5.4）。
  #   値のない軸は、この最大の 13.8 /s を、その軸の角速度の採用値に掛けた（整数に丸めた）。
  #   出典の違う値どうしの比なので、目安にとどまる。
  #
  # 測り方による違いの注意
  #   - 光学式の多くは 10〜15 Hz 前後で平滑化しており、角速度・角加速度のピークは低めに出る（branco2019 は 5 Hz）。
  #   - 「全体座標での体節の角速度」と「隣の体節に対する関節の角速度」は違う。各記録の note に書いた。
  #   - 臨床の可動域（ゴニオメーター）は、肩甲骨・骨盤・体幹の動きを含むことがある。モーションキャプチャの関節角と定義が同じとは限らない。

