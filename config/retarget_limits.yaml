# Limits on the joints in the whole-body retargeting (docs/wholebody_limits.md): what each value is, where it comes
# from (src: keys of `sources` below) and how it was derived (note).  tests/test_wholebody_retarget.py checks the servo
# values against their sources.  Editing a value changes the retargeting: rebuild the data (docs/wholebody_data.md).
#
# robot: inside Microban's IK (src/mjlab_microban/wholebody/retarget/core.py), besides robot.xml's joint ranges.
# human: limits on the human skeleton's joint angles before retargeting (anatomical axes); not used yet.
robot:
  hip_yaw_outward_max_deg:
    value: 105.0
    src: [lafan1, retarget_2aa2f61]
    note: >-
      The farthest the hip yaw turns a leg outward (left +, right -).  The robot's range runs from 60 degrees inward
      to 240 outward; a thigh swung out to the side and on behind was followed outward up to the 240 degree end.
      LAFAN1's motions, retargeted without this limit, turn a leg outward by at most 104 degrees.
  servo:
    speed_rad_s:
      value: 10.65
      src: [xc330_bam, pack_3s]
      note: >-
        The XC330-T288-T's no-load speed at the 3S pack's nominal 11.1 V: vin / kt, kt = 1.0425 Nm/A (the
        evaluation's servo_no_load_speed_rad_s).  Between two frames a joint moves at most speed / fps.
    acceleration_rad_s2:
      src: [xc330_bam, xc330_current_limit, microban_mjcf]
      note: >-
        Per joint: the torque at the firmware current limit, 0.91 A x kt = 0.949 Nm, over the joint's inertia at
        HOME: the servo's reflected inertia (the BAM armature, 0.00828 kg m^2, 83 % of it at the hip pitch to over
        99 % at the ankle roll) plus the links it moves, the joint's diagonal entry of MuJoCo's joint-space inertia
        matrix with the other joints held (retarget/model.py servo_accelerations).  Between two frames a joint
        changes its per-frame motion by at most acceleration / fps^2.
      value:
        head: 112.9
        neck_roll: 114.2
        neck_pitch: 114.3
        right_shoulder_pitch: 111.2
        right_shoulder_roll: 111.2
        right_elbow: 114.1
        right_hip_yaw: 112.7
        right_hip_roll: 95.9
        right_hip_pitch: 95.4
        right_knee: 109.0
        right_ankle_pitch: 113.8
        right_ankle_roll: 114.4
        left_shoulder_pitch: 111.2
        left_shoulder_roll: 111.2
        left_elbow: 114.1
        left_hip_yaw: 112.7
        left_hip_roll: 95.9
        left_hip_pitch: 95.4
        left_knee: 109.0
        left_ankle_pitch: 113.8
        left_ankle_roll: 114.4
sources:
  lafan1:
    authors: "Harvey FG, Yurick M, Nowrouzezahrai D, Pal C"
    year: 2020
    title: "Robust Motion In-betweening"
    journal: "ACM Transactions on Graphics 39(4) (LAFAN1, Ubisoft La Forge Animation Dataset)"
    url: "https://github.com/ubisoft/ubisoft-laforge-animation-dataset"
    note: "All 77 BVH files of lafan1.zip (SHA-256 ea918082...a977), docs/wholebody_data.md."
  retarget_2aa2f61:
    title: "Microban's retargeting of the human data at code 2aa2f61, without the hip yaw limit"
    note: "data/wholebody/gmr/lafan1/*.npz of that build: the outward hip yaw, both legs, every frame."
  xc330_bam:
    title: "BAM identification of the XC330-T288-T (30 recordings, m6 model)"
    file: "src/mjlab_microban/robot/xc330_params.json"
    url: "https://github.com/rhoban/bam"
    note: "kt 1.0425 Nm/A, R 10.0 ohm, armature 0.00828 kg m^2; tools/actuator_id/ in the microban repository."
  xc330_current_limit:
    title: "The XC330-T288-T firmware current limit, 0.91 A (the training actuator's max_current)"
    file: "src/mjlab_microban/robot/microban_constants.py"
    url: "https://emanual.robotis.com/docs/en/dxl/x/xc330-t288/"
  pack_3s:
    title: "Microban's 3S LiPo pack: 11.1 V nominal, 9.0-12.6 V (the training actuator's vin_range)"
    file: "src/mjlab_microban/robot/microban_constants.py"
  microban_mjcf:
    title: "Microban's model and HOME: link masses and inertias, HOME's joint angles"
    file: "src/mjlab_microban/robot/microban/robot.xml, config/home_pose.yaml"
