# scripts/retrain_all_for_home.py: every number of one release run that is not
# a training schedule (those are in src/mjlab_microban/schedules.py).  Editing
# a policy's training keys (task, envs, save_interval; pipeline/steps.py
# TRAINING_KEYS) retrains that policy (and what depends on it) on the next
# run; editing its judgment re-judges, never retrains.  `dry:` overrides apply
# to --dry-run only.
#
# Each policy trains once from scratch for its fixed number of updates
# (walking 30000, PICO 15000, get-up 18000) and its last checkpoint is judged
# once.  A failed item fails the step: the test is questioned first (a wrong
# test is fixed and the rerun re-judges without retraining); a valid failing
# test stops the release.  stage_tolerance: a curriculum stage may start at
# most this many updates after its update in the table (pipeline/monitor.py).

seed: 42

walk:
  task: Mjlab-Velocity-Microban
  envs: 4096
  save_interval: 500
  stage_tolerance: 1
  # Judgment: the held-out walk probe (pipeline/walk_probe.py, seeds
  # 101-105) and the 9x300 probe with seed 101 (the PICO source gate's probe,
  # which judges the walker with seed 42 at the start of the PICO step).  The
  # walking direction is judged by fixed signed-response minimums
  # (mjlab_microban/twist_pass_line.py); the measured joints may go 0.25 rad
  # beyond the soft limits (teleop_v12_safety.py).
  judgment:
    seeds: "101,102,103,104,105"
    probe_seed: 101
    max_falls: [1, 5]               # diagonal falls of 90, no push / pushed; single-axis 0
    # standing_still: foot touchdowns per second (both feet) on the standing command,
    # no pushes: at most one re-planted foot every two seconds (the walker
    # should stand still there).  Stepping in place is about 3.5 per second;
    # a walker that stands still, 0.0.
    still_touchdowns_per_s: 0.5
    # Soft and slippery floors (pipeline/floors.py: the soles' contact time
    # constant, s, and friction; no friction: the play env's 0.3-1.2), inside
    # training's range (robot/microban_constants.py).  The walk probe, the
    # 9x300 probe and standing still (on the soft ones) run again on each,
    # with the rigid floor's lines: the walker that walked on the robot
    # (a7c28c8a), on the servo model it was trained on, keeps them on every
    # one (rigid: falls 0/1/0 of 90/90/90, 9x300 worst margin +0.028; here
    # falls 0/0/0, margins +0.023 to +0.055, standing 0.033 rad/s).
    # Friction 0.15 is left out: there it falls 10 of 90 unpushed and 50
    # pushed and turns 0.01-0.05 rad/s on 0.5, and the other walkers fall
    # too (9 and 42 unpushed).  Trained on the robot's floor only, the walker
    # (45d46ac9) passes the rigid floor and falls 12-27 of 90 pushed on 0.1 s
    # and 0.3.
    floors:
      soft_0.05: {time_constant_s: 0.05}
      soft_0.1: {time_constant_s: 0.1}
      slippery_0.3: {friction: 0.3}
      soft_slippery: {time_constant_s: 0.1, friction: 0.3}

pico:
  task: Mjlab-Teleop-V13-ArmOverlay-Microban
  envs: 2048
  save_interval: 500
  stage_tolerance: 1

getup:
  task: Mjlab-Getup-Microban
  envs: 4096
  save_interval: 500
  stage_tolerance: 1
  # (name, mode, seed, extra arguments) of the judgment's evaluations.
  evals:
    - [stand_s11, stand, 11, [--imu-delay, "3", --noise]]
    - [stand_s5, stand, 5, [--imu-delay, "3", --noise]]
    - [push_s11, stand, 11, [--imu-delay, "3", --noise, --push, "x:0.3"]]
    - [posture_s11, posture, 11, []]
  gate:
    min_fallen_standing_fraction: 0.85
    max_push_fall_fraction: 0.10
    max_standing_joint_abs_vel_rad_s: 0.30
    min_posture_standing_fraction: 0.80
    # Standing targets saturated at the clip, the servo range +-pi (the
    # reward's clip barrier charges beyond it; targets between 1.57 and pi
    # are the torque authority the get-up needs and are allowed).
    max_standing_targets_on_clip: 0.05
  # The walking judgment's soft and slippery floors on every collision geom
  # (pipeline/floors.py; the get-up lies on its hands, knees and back, as in
  # training).  The fallen starts and the push (the stand evaluations) run
  # again on each, standing still on stand_still_floors, with the rigid
  # floor's lines (min_fallen_standing_fraction, max_push_fall_fraction,
  # stand_still).  The get-up that ran on the robot with the walker a7c28c8a
  # (e115a8cd, trained on the rigid floor), on the servo model it was trained
  # on, stands from 0.947-0.982 of its fallen starts on these floors (rigid
  # 0.965) and falls after 0, 0.12 (0.1 s), 0 and 0.03 of the pushes (rigid
  # 0); the get-up training on these floors (a2adb8f2, updates 8000 and
  # 9000) 0.945-1.0 and 0-0.049.  Standing still is judged on soft_0.05 only,
  # where that training stands as on the rigid floor (15-35 ms: leg RMS
  # 0.049-0.072 rad/s, no fall; 40 ms: 1.46-1.64 rad/s, 2 falls; rigid
  # 1.70-1.76, 1-2; e115a8cd falls 2 times in 8 there at 30 ms).
  # On 0.1 s, friction 0.3 and both, no get-up stands still without a fall
  # where it does on the rigid floor: a2adb8f2 (8000) falls 2, 1 and 2 times
  # in 40 at 15-35 ms; e115a8cd at its 15-30 ms 6 and 6 times in 32 on 0.1 s
  # and on both, and on 0.3 its legs shake at 30 ms (0.83 rad/s); rigid: no
  # fall, at most 0.013 rad/s.
  floors:
    soft_0.05: {time_constant_s: 0.05}
    soft_0.1: {time_constant_s: 0.1}
    slippery_0.3: {friction: 0.3}
    soft_slippery: {time_constant_s: 0.1, friction: 0.3}
  stand_still_floors: [soft_0.05]

# Standing still (pipeline/stand_still.py), a judgment of every policy: the
# walker and PICO stand at HOME on a zero command, the get-up from a fallen
# start (judged once it stands), each environment with one servo goal delay of
# 5-50 ms (the get-up: 15-40 ms, the delays its training draws) and one foot
# friction of 0.3-1.2 and the training's observation
# noise.  The noise is what shakes a policy that trembles: without it PICO
# v13g2 (it shook standing on the robot and fell) measures 0.046 rad/s, below
# the old walker's 0.063.  With it, the worst delay's leg-joint speed RMS
# (rad/s) of the whole-body policies is 0.030 (servo-refit run, update 12000)
# and 0.057 (final2), of the old walker (a7c28c8a) 0.088, all without a fall;
# v13g2 0.25 at 30 ms and 0.40 at 40 ms, 2 falls; the old get-up steps in
# place (1.3-1.8 while up) and 60 of 80 fall after standing.  The line is the
# geometric mean of the old walker's worst and v13g2's lowest trembling delay,
# sqrt(0.088 x 0.253) = 0.15; standing still, nothing falls.
# The walker stands again on the soft floors of walk.judgment.floors (every
# delay and friction on 0.05 s and on 0.1 s) with these lines: 0.033
# (a7c28c8a on its servo model) to 0.099 rad/s, no falls.
stand_still:
  seed: 107
  reps: 2                         # environments per (delay, friction)
  max_leg_speed_rms_rad_s: 0.15
  max_falls: 0

# A job whose log is not written for this long is stopped (exit code 2).
stall_minutes:
  train: 20
  eval: 30
# Another process training on the GPU (a `train` command or one with
# --env.scene.num-envs >= this) makes a real run wait before its next GPU job.
external_training_min_envs: 1024

dry:
  # Every schedule (mjlab_microban/schedules.py) is scaled by this factor; the
  # judgments are recorded, never enforced.  A stage applies at the first
  # episode reset after its update (StagedCurriculum runs in _reset_idx), so
  # the logged update can trail the table: by about one update with the real
  # env counts (~100 resets per rollout), by a few with 64 envs; hence
  # stage_tolerance 3 here.
  schedule_scale: 0.001
  walk: {envs: 64, save_interval: 1, stage_tolerance: 3}
  pico: {envs: 64, save_interval: 1, stage_tolerance: 3}
  getup:
    envs: 64
    save_interval: 1
    stage_tolerance: 3
    eval_envs: 16
    eval_steps: 150
  stand_still: {reps: 1}
