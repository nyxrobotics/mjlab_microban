# scripts/retrain_all_for_home.py: every number of one release run that is not
# a training schedule (those are in src/mjlab_microban/schedules.py).  Editing
# a policy's training keys (task, envs, save_interval; pipeline/steps.py
# TRAINING_KEYS) retrains that policy (and what depends on it) on the next
# run; editing its checks or judgment re-judges, never retrains.  `dry:`
# overrides apply to --dry-run only.

seed: 42

walk:
  task: Mjlab-Velocity-Microban
  envs: 4096
  save_interval: 500
  # Checks every 1000 updates while training (in parallel, one at a time):
  # the held-out probe W1-W5 (pipeline/walk_probe.py, seeds 101-105) and the
  # 9x300 probe with seed 101 (the PICO source gate's probe, which judges the
  # adopted walker with seed 42 at the start of the PICO step).  Both judge
  # the walking direction by the walking reward's own pass line
  # (mjlab_microban/twist_pass_line.py: every moving command beats standing
  # still, standing drifts less than the smallest checked command) and allow
  # the measured joints 0.25 rad beyond the soft limits
  # (teleop_v12_safety.py).  Two consecutive passes (N, N+1000) end the run
  # with model_<N+1000>, not before WALK_MIN_FINAL_UPDATES (5000: both checks
  # saw 1000+ updates of the only stage).
  # best: with no such pair by WALK_MAX_UPDATES (8000), the run ends with the
  # best checkpoint checked at or after WALK_MIN_FINAL_UPDATES (5000, 6000,
  # 7000 and the last, 7999): most passed items (W1-W5, 9x300), then the
  # largest worst reward margin over standing of every moving command, then
  # the later one (pipeline/steps.py best_walk_check; written down before the
  # forward-lean release walk).  If that one fails an item, the step fails:
  # the test is questioned first (a wrong test is fixed and the rerun
  # re-judges without retraining); a valid failing test stops the release.
  # No check stops a training before its last update.
  check:
    stage_tolerance: 1
    seeds: "101,102,103,104,105"
    probe_seed: 101
    w4_falls: [1, 5]                # diagonal falls of 90, no push / pushed; single-axis 0
    # W6: foot touchdowns per second (both feet) on the standing command,
    # no pushes.  The reward's best there is both feet still (1746fc5); one
    # re-planted foot every two seconds at most.  Stepping in place is about
    # 8 per second (walk_c1ab6dcb model_6000); the forward-lean walker that
    # stands still (lean_walk_cont2 model_29000) 0.35.
    still_touchdowns_per_s: 0.5

pico:
  task: Mjlab-Teleop-V12-HandPoseRelease-Microban
  envs: 2048
  save_interval: 500
  # Checks every 1000 updates after the feet are tightened: the judgment's
  # three evaluators with a held-out seed.
  check:
    stage_tolerance: 1
    seed: 101

getup:
  task: Mjlab-Getup-Microban
  envs: 4096
  save_interval: 500
  # (name, mode, seed, extra arguments) of the judgment's evaluations.
  evals:
    - [stand_s11, stand, 11, [--imu-delay, "3", --noise]]
    - [stand_s5, stand, 5, [--imu-delay, "3", --noise]]
    - [push_s11, stand, 11, [--imu-delay, "3", --noise, --push, "x:0.3"]]
    - [posture_s11, posture, 11, []]
  # Checks: recorded at record_at (before refine, before effort), then every
  # 1000 updates after effort; the judgment's evaluations with held-out
  # seeds.
  check:
    stage_tolerance: 1
    record_at: [3500, 9500]
    seeds: {stand_s11: 21, stand_s5: 22, push_s11: 21, posture_s11: 21}
  gate:
    min_fallen_standing_fraction: 0.85
    max_push_fall_fraction: 0.10
    max_standing_joint_abs_vel_rad_s: 0.30
    min_posture_standing_fraction: 0.80
    # Standing targets saturated at the clip, the servo range +-pi (the
    # reward's clip barrier charges beyond it; targets between 1.57 and pi
    # are the torque authority the get-up needs and are allowed).  It was
    # |target| >= 1.57, the clip before 2026-10-03: that line failed what
    # the reward allows (user rule 2026-10-07: question the test first).
    max_standing_targets_on_clip: 0.05

# A job whose log is not written for this long is stopped (exit code 2).
stall_minutes:
  train: 20
  eval: 30
# Another process training on the GPU (a `train` command or one with
# --env.scene.num-envs >= this) makes a real run wait before its next GPU job.
external_training_min_envs: 1024

dry:
  # Every schedule (mjlab_microban/schedules.py) is scaled by this factor;
  # the checks run on the first two checkpoints only and are recorded (never
  # stop or end a dry run).  A stage applies at the first episode reset after
  # its update (StagedCurriculum runs in _reset_idx), so the logged update can
  # trail the table: by about one update with the real env counts (~100 resets
  # per rollout), by a few with 64 envs; hence stage_tolerance 3 here.
  schedule_scale: 0.001
  walk: {envs: 64, save_interval: 1, check: {stage_tolerance: 3, max_checks: 2}}
  pico: {envs: 64, save_interval: 1, check: {stage_tolerance: 3, max_checks: 2}}
  getup:
    envs: 64
    save_interval: 1
    eval_envs: 16
    eval_steps: 150
    check: {stage_tolerance: 3, max_checks: 2}
